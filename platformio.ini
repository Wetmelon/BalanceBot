; BalanceBot: two ODrives in torque mode on CAN, BNO080 IMU on I²C, on either board:
;   portenta_c33     Arduino Portenta C33 on a Portenta Hat Carrier: CAN1, Wire2
;   feather_m4_can   Adafruit Feather M4 CAN (SAME51): on-board CAN, Wire
;
;   pio run                              build both boards and the SIL
;   pio run -e <board> -t upload         flash one
;   pio run -e sil -t exec               host SIL: nonlinear plant around the same tick
;
;   pio test -e <board>                  the CAN driver's FIFOs in loopback, on a board with no bus
;
; Damp is the external/damp submodule (git submodule update --init, not --recursive: Damp's own
; submodules are its test deps). ETL comes from the registry at the version Damp tests against.

[platformio]
default_envs = portenta_c33, feather_m4_can, sil

[env]
extra_scripts = pre:cxx_flags.py
build_flags =
    -O2
    -ffast-math
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iexternal/damp/inc
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17 -Os
build_src_flags = -Wall -Wextra -Wdouble-promotion -Wfloat-conversion
lib_deps = etlcpp/Embedded Template Library@20.48.1

[env:portenta_c33]
; lib/Arduino_CAN is patched against this platform's core (1.6.0) and its FSP fork: move them together.
platform = renesas-ra@1.9.0
board = portenta_c33
framework = arduino
; The Renesas core's own GCC is too old for C++20; Damp needs GCC 11+.
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
extra_scripts = ${env.extra_scripts}, post:c33_upload.py
; lib/Adafruit_CAN is the Feather's driver: LDF sees its #include through the #if and would build it.
lib_ignore = Adafruit CAN
; Link libraries as objects, not archives: lib/Arduino_CAN/src/r_canfd.c then always replaces the
; r_canfd.o in the core's libfsp.a, and a link that pulled both would fail on duplicate symbols.
lib_archive = no
monitor_speed = 115200

[env:feather_m4_can]
platform = atmelsam@9.0.0
board = adafruit_feather_m4_can
framework = arduino
; Same GCC 12.3 swap: atmelsam ships GCC 7.2.
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
lib_deps =
    ${env.lib_deps}
    briscoetech/FreeRTOS_SAMD51@1.3.0
; lib/Arduino_CAN is the C33's driver, ignored for the same reason.
lib_ignore = Arduino_CAN
test_ignore = test_can_no_ack
monitor_speed = 115200

[env:sil]
platform = native
build_src_filter = -<*> +<../sil/>
test_ignore = test_*
