; BalanceBot: Arduino Portenta C33, two ODrives in torque mode on CAN1, BNO080 IMU on Wire2.
;
;   pio run -e portenta_c33              build the firmware
;   pio run -e portenta_c33 -t upload    flash it
;   pio run -e sil -t exec              host SIL: nonlinear plant around the same tick
;
; Damp is the external/damp submodule (git submodule update --init, not --recursive: Damp's own
; submodules are its test deps). ETL comes from the registry at the version Damp tests against.

[platformio]
default_envs = portenta_c33, sil

[env]
extra_scripts = pre:cxx_flags.py
build_flags =
    -O2
    -ffast-math
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iexternal/damp/inc
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17 -Os
build_src_flags = -Wall -Wextra -Wdouble-promotion -Wfloat-conversion
lib_deps = etlcpp/Embedded Template Library@20.48.1

[env:portenta_c33]
platform = renesas-ra
board = portenta_c33
framework = arduino
; The Renesas core's own GCC is too old for C++20; Damp needs GCC 11+.
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
monitor_speed = 115200

[env:sil]
platform = native
build_src_filter = -<*> +<../sil/>
