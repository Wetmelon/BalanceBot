; BalanceBot: Arduino MKR WiFi 1010 + MKR CAN shield, two ODrives in torque mode, BNO080 IMU.
;
;   pio run -e mkrwifi1010              build the firmware
;   pio run -e mkrwifi1010 -t upload    flash it
;   pio run -e sil -t exec              host SIL: nonlinear plant around the same tick
;
; Damp is the external/damp submodule (git submodule update --init, not --recursive: Damp's own
; submodules are its test deps). ETL comes from the registry at the version Damp tests against.

[platformio]
default_envs = mkrwifi1010, sil

[env]
extra_scripts = pre:cxx_flags.py
build_flags =
    -O2
    -ffast-math
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iexternal/damp/inc
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17 -Os
build_src_flags = -Wall -Wextra -Wdouble-promotion -Wfloat-conversion
lib_deps = etlcpp/Embedded Template Library@20.48.1

[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
; The SAMD core's own GCC 7.2 has no C++20; Damp needs GCC 11+.
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
build_src_filter = +<*>
lib_deps =
    ${env.lib_deps}
    briscoetech/FreeRTOS_SAMD21@2.3.0
    sandeepmistry/CAN@0.3.1
    arduino-libraries/WiFiNINA@2.1.1
monitor_speed = 115200

[env:sil]
platform = native
build_src_filter = -<*> +<../sil/>
